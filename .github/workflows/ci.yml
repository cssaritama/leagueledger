name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend quality and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint backend
        run: uv run ruff check app tests

      - name: Run tests
        run: uv run pytest -q

  backend-postgres:
    name: PostgreSQL integration test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leagueledger_test
          POSTGRES_USER: leagueledger
          POSTGRES_PASSWORD: leagueledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leagueledger -d leagueledger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://leagueledger:leagueledger_test@127.0.0.1:5432/leagueledger_test
      RUN_POSTGRES_TESTS: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run PostgreSQL integration test
        run: uv run pytest -q tests/test_postgres_integration.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-postgres, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t leagueledger-api:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL=/api -t leagueledger-web:ci ./frontend