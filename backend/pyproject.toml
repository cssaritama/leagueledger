[project]
name = "leagueledger-backend"
version = "0.1.0"
description = "LeagueLedger API - matches are facts, standings are derived"
requires-python = ">=3.11"
authors = [{ name = "Carlos Saritama" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
